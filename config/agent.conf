<!-- Container-only endpoint. No host directories or Docker socket mounted. -->
<ossec_config>
  <client>
    <server><address>CHANGE_MANAGER_IP</address><port>CHANGE_MANAGER_PORT</port><protocol>tcp</protocol></server>
    <notify_time>10</notify_time>
    <time-reconnect>15</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>
  <client_buffer><disabled>no</disabled><queue_size>5000</queue_size><events_per_second>500</events_per_second></client_buffer>
  <localfile><log_format>json</log_format><location>/lab/logs/events.json</location></localfile>
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes" report_changes="yes">/lab/monitored</directories>
    <synchronization><enabled>yes</enabled><interval>1m</interval></synchronization>
  </syscheck>
  <wodle name="syscollector">
    <disabled>no</disabled><interval>1h</interval><scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware><os>yes</os><network>yes</network><packages>yes</packages><ports all="yes">yes</ports><processes>yes</processes>
  </wodle>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <active-response><disabled>yes</disabled></active-response>
  <logging><log_format>plain</log_format></logging>
</ossec_config>
