# Adapted from Wazuh Docker v4.14.8 (GPL-2.0); see THIRD_PARTY.md.
name: siem-homelab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    hostname: wazuh.manager
    restart: unless-stopped
    logging: *logging
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?Run python scripts/lab.py setup first}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD:?Run setup first}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./runtime/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./runtime/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./runtime/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./runtime/manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./runtime/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
      - ./config/local_rules.xml:/wazuh-config-mount/etc/rules/homelab_rules.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    hostname: wazuh.indexer
    restart: unless-stopped
    logging: *logging
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      LAB_ADMIN_PASSWORD: ${INDEXER_PASSWORD:?Run setup first}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./runtime/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./runtime/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./runtime/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./runtime/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./runtime/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./runtime/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./runtime/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert config/certs/root-ca.pem -u \"admin:$$LAB_ADMIN_PASSWORD\" https://wazuh.indexer:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    hostname: wazuh.dashboard
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8443:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?Run setup first}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Run setup first}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD:?Run setup first}
    volumes:
      - ./runtime/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./runtime/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./runtime/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./runtime/dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./runtime/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer: {condition: service_healthy}
      wazuh.manager: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs https://localhost:5601/app/login >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  lab.endpoint:
    image: wazuh/wazuh-agent:4.14.8
    hostname: lab-linux
    restart: unless-stopped
    logging: *logging
    environment:
      WAZUH_MANAGER_SERVER: wazuh.manager
      WAZUH_AGENT_NAME: lab-linux
      WAZUH_REGISTRATION_PASSWORD: ${ENROLLMENT_PASSWORD:?Run setup first}
    volumes:
      - ./config/agent.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - endpoint_etc:/var/ossec/etc
      - endpoint_logs:/var/ossec/logs
      - endpoint_queue:/var/ossec/queue
      - endpoint_lab:/lab
    depends_on:
      wazuh.manager: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'status=.connected.' /var/ossec/var/run/wazuh-agentd.state"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  endpoint_etc:
  endpoint_logs:
  endpoint_queue:
  endpoint_lab:
